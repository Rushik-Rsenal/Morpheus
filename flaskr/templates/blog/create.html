{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}New Workflow{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post" id="create-workflow-form" enctype="multipart/form-data">
    <label for="title">Title</label>
    <input name="title" id="title" value="{{ request.form['title'] }}" required>
    
    <label for="body">Body</label>
    <textarea name="body" id="body">{{ request.form['body'] }}</textarea>
    
    <label for="dataset">Upload Dataset</label>
    <input type="file" name="dataset" id="dataset" accept=".csv, .txt, .xlsx" required>
    
    <!-- Select the feature -->
    <label for="feature-name">Select Feature</label>
    <input name="feature-name" id="feature-name" required>

    <!-- Select stressor -->
    <label for="stressor-name">Select Stressor</label>
    <input name="stressor-name" id="stressor-name" required>


    <label for="script">Upload Python Script</label>
    <input type="file" name="script" id="script" accept=".py" required> 
    <input type="submit" value="Save">
  </form>
{% endblock %}
